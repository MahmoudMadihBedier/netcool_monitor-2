# Optional: builds the portable version on GitHub's Windows machines (no Windows PC needed).
name: Build portable
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m playwright install --no-shell chromium
      - run: python -m unittest discover tests
      - run: python -m PyInstaller --noconfirm --clean NetcoolShiftMonitor.spec
      - uses: actions/upload-artifact@v4
        with:
          name: NetcoolShiftMonitor_portable
          path: dist/NetcoolShiftMonitor/
